version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Major versions are updated manually
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Keep in line with the minimum supported Node.js version
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
